<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control</title>
<style>
  :root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.5);--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    line-height:1.5;overflow-x:hidden;padding-bottom:110px;min-height:100vh}
  ::selection{background:#fff;color:#000}
  .bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(70% 45% at 50% -5%,rgba(255,255,255,.09),transparent 60%),#000}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 25%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 25%,transparent 70%)}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}

  .topbar{position:sticky;top:10px;z-index:60;margin:10px 12px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 18px;border-radius:24px;
    background:linear-gradient(120deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 50%,rgba(255,255,255,.10));
    backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 8px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.08em}
  .orb{width:26px;height:26px;border-radius:50%;border:3px solid #fff;position:relative}
  .orb::after{content:"";position:absolute;inset:-9px;border:1px solid rgba(255,255,255,.25);border-radius:50%}

  /* LOGIN */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-box{width:100%;max-width:360px;border-radius:28px;padding:34px 28px;text-align:center;
    background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid var(--line);
    backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 14px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16)}
  .lock{width:56px;height:56px;border-radius:18px;margin:0 auto 18px;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center}
  .lock svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .login-box h2{font-size:17px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
  .login-box p{color:var(--dim);font-size:12px;margin:8px 0 22px}
  .login-box input{width:100%;font-family:inherit;font-size:15px;color:#fff;padding:14px 16px;
    border-radius:15px;border:1px solid var(--line);background:rgba(0,0,0,.45);outline:none;
    text-align:center;letter-spacing:.2em;transition:.2s}
  .login-box input:focus{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 4px rgba(255,255,255,.07)}
  .login-box .err{color:#ff6b6b;font-size:11px;letter-spacing:.08em;height:16px;margin:8px 0}
  .login-box button{width:100%;padding:15px;border:none;border-radius:16px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
    color:#000;background:linear-gradient(180deg,#fff,#cfcfcf);
    box-shadow:0 6px 22px rgba(255,255,255,.25), inset 0 1px 0 rgba(255,255,255,.9)}
  .login-box button:active{transform:scale(.98)}

  /* APP */
  #app{display:none}
  header{padding:40px 0 6px;text-align:center}
  h1{font-size:clamp(24px,5vw,36px);font-weight:900}
  .sub{color:var(--dim);font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 8px}
  .stat{border-radius:18px;padding:16px 8px;text-align:center;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .stat .v{font-size:19px;font-weight:900}
  .stat .k{font-size:9px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

  section{padding:30px 0}
  .sec-title{font-size:10px;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center}

  .order{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;margin-bottom:12px;
    background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:.18s}
  .order.done{opacity:.55}
  .ologo{width:56px;height:56px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;overflow:visible;cursor:pointer}
  .ologo img{width:48px;height:48px;object-fit:cover;border-radius:13px}

  /* ---- 3D UC card (PUBG style) ---- */
  .coin{
    position:relative;width:52px;height:40px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;font-family:Arial,Arial Black,sans-serif;
    letter-spacing:.02em;
    background:linear-gradient(135deg,#f5d67a 0%,#d4a637 45%,#8a6512 100%);
    clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%);
    animation:cardFloat 3.4s ease-in-out infinite;
  }
  .coin::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,#c99f3d,#7a5a10);
    transform:rotate(-9deg) translate(-7px,-7px);
    clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));
  }
  .coin .face{
    position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#2a241d,#14100c);
    clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.18), inset 0 -2px 4px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .coin .face::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 35%,rgba(255,235,160,.3) 50%,transparent 65%);
    animation:glare 4.5s ease-in-out infinite;
  }
  .coin span{
    position:relative;z-index:1;
    background:linear-gradient(180deg,#fff0b0,#e8c05a 55%,#a87c1c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-6px) rotate(3deg)}
  }
  @keyframes glare{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
  .order:nth-child(2n) .coin{animation-delay:-1.1s}
  .order:nth-child(3n) .coin{animation-delay:-2.2s}
  .order:nth-child(5n) .coin{animation-duration:4.1s}

  .order:nth-child(2n) .coin{animation-delay:-1.1s}
  .order:nth-child(3n) .coin{animation-delay:-2.2s}
  .order:nth-child(5n) .coin{animation-duration:4.1s}
  .obody{flex:1;min-width:0}
  .oname{font-weight:800;font-size:15px}
  .ometa{font-size:11px;color:var(--dim)}
  .oprice{font-weight:900;font-size:15px;white-space:nowrap}
  .st{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;border:1px solid;white-space:nowrap}
  .st.new{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
  .st.done{color:#000;background:#fff;border-color:#fff}
  .act{display:flex;gap:8px}
  .abtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
  .abtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .abtn.ok:hover{background:#fff;color:#000;border-color:#fff}
  .abtn.del:hover{background:rgba(255,60,60,.15);border-color:rgba(255,60,60,.6);color:#ff6b6b}
  .empty{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.1em;padding:40px 0;text-transform:uppercase;
    border:1px dashed var(--line);border-radius:22px}

  .modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px}
  .modal.open{display:flex}
  .modal img{max-width:90vw;max-height:80vh;border-radius:20px;border:1px solid var(--line)}
  .modal .close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;font-size:18px;font-family:inherit}

  .dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:70;
    display:flex;gap:4px;align-items:center;padding:10px 12px;border-radius:26px;
    background:linear-gradient(120deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 45%,rgba(255,255,255,.12));
    backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 12px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.3);max-width:calc(100vw - 24px)}
  .di{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;
    cursor:pointer;color:var(--dim);font-family:inherit;font-size:9px;font-weight:700;letter-spacing:.06em;
    padding:8px 14px;border-radius:16px;transition:.18s}
  .di svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .di.active{color:#000;background:#fff;box-shadow:0 4px 14px rgba(255,255,255,.25)}
  .sep{width:1px;height:30px;background:rgba(255,255,255,.15)}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(60px);z-index:100;
    padding:12px 22px;border-radius:15px;font-size:12px;font-weight:700;letter-spacing:.08em;
    background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.4);color:#fff;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:transform .28s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}
  footer{padding:30px 0 40px;text-align:center;color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}

  @media(max-width:640px){ .stats{grid-template-columns:repeat(2,1fr)} .oprice{display:none} }
</style>
</head>
<body>
<div class="bg"></div>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h2>Вход для админа</h2>
    <p>Введи секретный пароль доступа</p>
    <input id="pwd" type="password" placeholder="••••••••" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="loginBtn">Войти</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand"><div class="orb"></div>CONTROL</div>
    <div style="display:flex;gap:8px">
      <span class="st new" id="me">admin</span>
      <button class="abtn ok" title="Выйти" onclick="logout()" style="width:auto;padding:0 12px;font-size:10px;font-family:inherit;font-weight:800;letter-spacing:.1em">ВЫХОД</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <h1>Панель ордеров</h1>
      <div class="sub">один оператор · полный контроль</div>
      <div class="stats">
        <div class="stat"><div class="v" id="sAll">0</div><div class="k">всего</div></div>
        <div class="stat"><div class="v" id="sNew">0</div><div class="k">в работе</div></div>
        <div class="stat"><div class="v" id="sDone">0</div><div class="k">выполнено</div></div>
        <div class="stat"><div class="v" id="sRev">$0</div><div class="k">выручка</div></div>
      </div>
    </header>

    <section>
      <div class="sec-title"><span>// Ордера</span><span id="count"></span></div>
      <div id="list"></div>
    </section>

    <footer>DANILKA CONTROL</footer>
  </div>

  <div class="dock">
    <button class="di active" data-f="all" onclick="setFilter('all')">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Все</button>
    <div class="sep"></div>
    <button class="di" data-f="new" onclick="setFilter('new')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>В работе</button>
    <button class="di" data-f="done" onclick="setFilter('done')">
      <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Готовые</button>
    <div class="sep"></div>
    <button class="di" onclick="refresh()">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>Обновить</button>
  </div>

  <div class="modal" id="modal" onclick="this.classList.remove('open')">
    <button class="close">×</button>
    <img id="bigLogo" alt="">
  </div>
</div>

<div class="toast" id="toast">OK</div>

<script>
let token = sessionStorage.getItem('danilka_token') || '';
let filter = 'all';

const H = () => ({'Content-Type':'application/json', Authorization:'Bearer ' + token});

/* ---------- auth ---------- */
async function tryLogin(){
  const password = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password})});
  if(res.ok){
    token = (await res.json()).token;
    sessionStorage.setItem('danilka_token', token);
    enter();
  } else err.textContent = 'неверный пароль';
}
function enter(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  refresh();
}
async function logout(){
  await fetch('/api/logout', {method:'POST', headers:H()});
  sessionStorage.removeItem('danilka_token');
  location.reload();
}
document.getElementById('loginBtn').onclick = tryLogin;
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });

/* ---------- orders ---------- */
function setFilter(f){
  filter = f;
  document.querySelectorAll('.di[data-f]').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  render(lastData);
}
let lastData = [];
async function refresh(){
  try{
    const res = await fetch('/api/orders');
    lastData = await res.json();
    render(lastData);
  }catch{}
}
function render(all){
  const arr = all.filter(o => filter==='all' || o.status===filter);
  document.getElementById('sAll').textContent = all.length;
  document.getElementById('sNew').textContent = all.filter(o=>o.status==='new').length;
  document.getElementById('sDone').textContent = all.filter(o=>o.status==='done').length;
  document.getElementById('sRev').textContent = '$' + all.filter(o=>o.status==='done').reduce((s,o)=>s+o.price,0).toFixed(2);
  document.getElementById('count').textContent = arr.length + ' показано';
  document.getElementById('list').innerHTML = arr.length ? arr.map(o=>`
    <div class="order ${o.status}">
      <div class="ologo" ${o.logo ? `onclick="showLogo('${o.logo}')"` : ''}>${o.logo ? `<img src="${o.logo}">` : '<div class="coin"><div class="face"><span>UC</span></div></div>'}</div>
      <div class="obody">
        <div class="oname">${o.uc.toLocaleString()} UC ${o.bonus?'· '+o.bonus:''} — ${o.nick}</div>
        <div class="ometa">${o.id} · ID ${o.pid} · ${o.pay} · ${new Date(o.ts).toLocaleString('ru-RU')}</div>
      </div>
      <div class="oprice">$${o.price.toFixed(2)}</div>
      <span class="st ${o.status}">${o.status==='new'?'в работе':'выполнен'}</span>
      <div class="act">
        <button class="abtn ok" onclick="toggle('${o.id}')">
          ${o.status==='new'
            ? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
            : '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'}
        </button>
        <button class="abtn del" onclick="del('${o.id}')">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>`).join('') : '<div class="empty">ордеров нет</div>';
}
async function toggle(id){
  const o = lastData.find(x=>x.id===id);
  const status = o.status==='new' ? 'done' : 'new';
  await fetch('/api/orders/'+id, {method:'PATCH', headers:H(), body:JSON.stringify({status})});
  refresh();
  toast(status==='done' ? 'Ордер выполнен ✓' : 'Возвращён в работу');
}
async function del(id){
  const res = await fetch('/api/orders/'+id, {method:'DELETE', headers:H()});
  if(res.status===401){ toast('Сессия истекла'); return logout(); }
  refresh(); toast('Ордер удалён');
}
function showLogo(src){
  document.getElementById('bigLogo').src = src;
  document.getElementById('modal').classList.add('open');
}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}

/* auto-login if session exists */
if(token){ enter(); setInterval(refresh, 5000); }
</script>
</body>
</html>
